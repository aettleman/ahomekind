<script>
(function(){
/* "Where do you draw the line?" quiz.
   Questions move deliberately from people, to pets, to farmed animals,
   to wild animals - never labelled to the quiz-taker as stages.
   Every tag is only ever set from an option someone explicitly clicked -
   never inferred from an option they didn't pick. */
var Q = [
 {type:'what would you do', q:'A shop gives you £10 too much change. What do you do?',
  a:[['Hand it back straight away'],['Depends if it’s a big chain or a little local shop'],['Keep it, their mistake'],['I probably wouldn’t even notice']]},
 {type:'agree or disagree', scale:true, q:'Causing pain to someone weaker than you, when there’s no real need to, is wrong.',
  a:[['Strongly agree',['human_harm']],['Agree',['human_harm']],['Disagree'],['Strongly disagree']]},
 {type:'which would you pick', q:'Would you eat a dog, if it was legal and cooked really well?',
  a:[['Never',['dog']],['Probably not',['dog']],['Maybe, just to try it'],['Yes, why not']]},
 {type:'what would you do', q:'Would you drip a new shampoo into a rabbit’s eyes, to check it’s safe for you?',
  a:[['No, never',['rabbit']],['Only if there was no other way to check'],['If I was paid enough'],['Yes, my safety comes first']]},
 {type:'agree or disagree', scale:true, q:'Animals feel fear and pain much like we do.',
  a:[['Strongly agree',['feel']],['Agree',['feel']],['Disagree'],['Strongly disagree']]},
 {type:'what would you do', q:'You’re handed a knife and a lamb, and told dinner is up to you. What happens?',
  a:[['I couldn’t do it',['lamb']],['I could, if I really had to'],['I’d do it, it’s just food'],['I’d find something else to eat',['lamb']]]},
 {type:'agree or disagree', scale:true, q:'Taking a newborn away from its mother, for no reason other than profit, is cruel.',
  a:[['Strongly agree',['mother']],['Agree',['mother']],['Disagree'],['Strongly disagree']]},
 {type:'agree or disagree', scale:true, q:'Hurting an animal when there’s no real need to is wrong.',
  a:[['Strongly agree',['noneed']],['Agree',['noneed']],['Disagree'],['Strongly disagree']]},
 {type:'which is closest', q:'A coat or a pair of shoes can last for years. Is that reason enough to end an animal’s life for it?',
  a:[['No, not for something that lasts',['coat']],['Depends on the animal'],['Yes, if there’s no needless cruelty in it'],['Never really thought about it']]},
 {type:'which is closest', q:'Should shoppers be able to see exactly how their food was made, from the farm to the slaughterhouse?',
  a:[['Yes, with cameras anyone can watch'],['Yes, if they want to look'],['There’s no real need'],['Honestly, I’d rather not know',['notknow']]]},
 {type:'which would you pick', q:'If it was legal and normal where you live, which of these would you actually do yourself?',
  a:[['Go fishing for sport'],['Go hunting birds for sport'],['Both, if I had the chance'],['Neither',['wild']]]}
];

/* What each commitment is reflected back as, and the fact it's set against.
   'human_harm' is never shown alone - it only ever combines with
   'noneed' to make 'parity', added below in commits(). */
var M = {
 parity:{said:'You said it’s wrong to cause pain to someone weaker than you without real need - and you said the same about animals.',
   fact:'That’s the same principle, applied consistently. Most of what happens to farmed animals isn’t because there’s no other way to eat, dress or wash - it’s because it’s cheaper and easier.'},
 lamb:{said:'You couldn’t kill a lamb yourself.',
   fact:'Lambs in the UK are stunned, then their throats are cut. Someone does that for every lamb chop and Sunday roast.'},
 dog:{said:'You wouldn’t eat a dog.',
   fact:'Pigs match or beat dogs on intelligence tests. 90% of pigs in England and Wales are lowered into high-strength CO₂ gas, which the government’s own Animal Welfare Committee says “inevitably” causes pain, distress and fear before they lose consciousness.',
   src:'Animal Welfare Committee, 2025; FSA Slaughter Sector Survey'},
 mother:{said:'Taking a newborn from its mother for profit is cruel.',
   fact:'For her milk to be sold, a dairy cow’s calf is usually taken from her within the first few days. Then she’s made pregnant again.',
   src:'Compassion in World Farming'},
 coat:{said:'Something that lasts for years isn’t reason enough to end an animal’s life, you said.',
   fact:'Leather is the skin of an animal killed for it, most often a cow - usually sold alongside the meat and dairy industries rather than the reason the animal was farmed in the first place.'},
 wild:{said:'You wouldn’t hunt birds or fish for sport yourself.',
   fact:'Around 40-50 million pheasants and partridges are reared and released into the British countryside each year to be shot, most of it for sport. Fish have pain receptors and respond to injury in ways scientists increasingly treat as evidence they can suffer, not just react.',
   src:'European Journal of Wildlife Research, 2021; RSPCA / peer-reviewed pain research'},
 rabbit:{said:'You’d never put shampoo in a rabbit’s eyes.',
   fact:'Finished cosmetics can’t be tested on animals in the UK, but some of the ingredients inside them still can be, under chemical safety rules. Checking the brand is the only way to know.'},
 feel:{said:'Animals feel fear and pain much like we do.',
   fact:'UK law agrees: the Animal Welfare (Sentience) Act 2022 formally recognises animals as sentient beings.'},
 noneed:{said:'Hurting an animal without real need is wrong.',
   fact:'The British Dietetic Association says a well-planned plant-based diet can support healthy living at every age. For most of us, the need isn’t there.'},
 notknow:{said:'You’d rather not know how your food is made.',
   fact:'That’s honest, and it’s how most people get round a supermarket. It’s worth asking yourself why not looking is easier.'}
};
var ORDER = ['parity','lamb','dog','mother','coat','wild','rabbit','feel','noneed','notknow'];

var app = document.getElementById('qz-root');
var answers = Q.map(function(){ return null; });
var i = 0, finalAnswer = null;
var LEAF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18c-1-7 3-12 13-13 .5 9-4 14-11 13.5"/><path d="M6 18c2-3 5-6 8-7.5"/></svg>';
function top0(){ window.scrollTo({top:0}); }

function start(){
  app.innerHTML = '<div class="qz-screen">'
   + '<div class="qz-arch">' + LEAF + '<span class="qz-hand">no right answers</span></div>'
   + '<p class="qz-kick">a two-minute quiz</p>'
   + '<h1 class="qz-h">Where do you <em>draw the line?</em></h1>'
   + '<p class="qz-lede">' + Q.length + ' quick questions about right, wrong, and the everyday choices in between. Answer how you actually feel, not how you think you’re supposed to. Nobody sees your answers but you.</p>'
   + '<button class="qz-btn" id="qzGo">start &rarr;</button>'
   + '<div class="qz-meta"><span>' + Q.length + ' questions</span><span>about 2 minutes</span><span>nothing saved or sent</span></div>'
   + '</div>';
  document.getElementById('qzGo').onclick = function(){ i = 0; show(); };
}

function header(){
  return '<div class="qz-top"><button class="qz-back" id="qzBack"' + (i === 0 ? ' disabled' : '') + '>&larr; back</button>'
   + '<div class="qz-prog" aria-hidden="true"><i style="width:' + (i / Q.length * 100) + '%"></i></div>'
   + '<span class="qz-count">' + (i + 1) + ' / ' + Q.length + '</span></div>';
}
function advance(){ if (i < Q.length - 1) { i++; show(); } else mirror(); }

function show(){
  var q = Q[i];
  var h = '<div class="qz-screen">' + header()
   + '<span class="qz-type">' + q.type + '</span>'
   + '<h2 class="qz-h" id="qzQh">' + q.q + '</h2>'
   + '<div class="qz-opts' + (q.scale ? ' qz-scale' : '') + '" role="radiogroup" aria-labelledby="qzQh">';
  q.a.forEach(function(a, k){
    var sel = answers[i] === k;
    h += '<button class="qz-opt' + (sel ? ' qz-sel' : '') + '" role="radio" aria-checked="' + sel + '" data-k="' + k + '"><span class="qz-dot"></span><span>' + a[0] + '</span></button>';
  });
  h += '</div></div>';
  app.innerHTML = h;
  app.querySelectorAll('.qz-opt').forEach(function(b){
    b.onclick = function(){
      var k = +b.dataset.k;
      answers[i] = k;
      app.querySelectorAll('.qz-opt').forEach(function(o){ o.classList.toggle('qz-sel', o === b); o.setAttribute('aria-checked', o === b); });
      setTimeout(advance, 260);
    };
  });
  document.getElementById('qzBack').onclick = function(){ if (i > 0) { i--; show(); } };
  top0();
}

function commits(){
  var c = {};
  Q.forEach(function(q, n){
    if (answers[n] !== null && q.a[answers[n]][1]) {
      q.a[answers[n]][1].forEach(function(key){ c[key] = true; });
    }
  });
  // parity only fires when the same principle was affirmed for a person AND an animal
  if (c.human_harm && c.noneed) { c.parity = true; delete c.noneed; }
  delete c.human_harm;
  return ORDER.filter(function(k){ return c[k]; });
}

function mirror(){
  var keys = commits().slice(0, 5);
  var h = '<div class="qz-screen"><p class="qz-kick">before the last question</p>';
  if (keys.length) {
    h += '<h1 class="qz-h">Here’s where you drew the line.</h1>'
      + '<p class="qz-plain">Next to each answer is what actually happens.</p><ul class="qz-mirror">';
    keys.forEach(function(k){
      var m = M[k];
      h += '<li' + (k === 'parity' ? ' class="qz-parity"' : '') + '><p class="qz-said"><small>you said</small>' + m.said + '</p><p class="qz-fact">' + m.fact + (m.src ? '<span class="qz-src">' + m.src + '</span>' : '') + '</p></li>';
    });
    h += '</ul>';
  } else {
    h += '<h1 class="qz-h">You drew very few lines.</h1><p class="qz-plain">That’s an honest set of answers. One thing worth knowing anyway: about 1.2 billion animals were killed for food in the UK in 2023, roughly 17 for every person.</p>';
  }
  h += '<button class="qz-btn" id="qzLast">one last question &rarr;</button></div>';
  app.innerHTML = h;
  document.getElementById('qzLast').onclick = finalQ;
  top0();
}

var FINAL = [
 ['I hadn’t thought of it like that','A'],
 ['I honestly don’t know','A'],
 ['I’d rather I didn’t','B'],
 ['I’m comfortable with it','C']
];
function finalQ(){
  var lamb = commits().indexOf('lamb') > -1;
  var h = '<div class="qz-screen"><div class="qz-big-q"><p class="qz-kick">last question</p>'
   + '<h1 class="qz-h" id="qzFq">' + (lamb ? 'If you wouldn’t do it yourself, why pay someone else to do it for you?' : 'If you wouldn’t want to watch it, why pay someone else to do it for you?') + '</h1>'
   + '<div class="qz-opts" role="radiogroup" aria-labelledby="qzFq">';
  FINAL.forEach(function(f, k){ h += '<button class="qz-opt" role="radio" aria-checked="false" data-k="' + k + '"><span class="qz-dot"></span><span>' + f[0] + '</span></button>'; });
  h += '</div></div></div>';
  app.innerHTML = h;
  app.querySelectorAll('.qz-opt').forEach(function(b){
    b.onclick = function(){
      b.classList.add('qz-sel'); b.setAttribute('aria-checked', 'true');
      finalAnswer = FINAL[+b.dataset.k][1];
      setTimeout(result, 300);
    };
  });
  top0();
}

function result(){
  var VEG = '<p class="qz-plain">If you’d like to stop paying for it, there’s a word for that: vegan. It isn’t a club or a personality. It’s just not paying for the things you’ve already said you’re against, and you don’t have to do it all at once.</p>';
  var R = {
   A:{h:'Most people haven’t. That’s the whole point.',
      p:'Nobody sits down and decides to pay for this. It’s just the default: the aisle, the menu, what we grew up with. Now you’ve thought about it once, you’ll probably think about it again.',
      v:true, sh:'If you want a first step', sp:'Start with something that costs you nothing: check whether the products already in your bathroom were tested on animals.',
      b:'<a class="qz-btn" href="brand-check.html">check a brand &rarr;</a><a class="qz-btn qz-ghost" href="impact.html">see your impact</a>'},
   B:{h:'Then your line is already drawn.',
      p:'Your own answers say where you stand. The gap between that and your shopping is habit, and habits change one swap at a time.',
      v:true, sh:'Start where it’s easiest', sp:'See what just a few plant-based days a week would add up to over a year. The number is real, and it’s yours.',
      b:'<a class="qz-btn" href="impact.html">work out your impact &rarr;</a><a class="qz-btn qz-ghost" href="brand-check.html">check a brand</a>'},
   C:{h:'Thanks for being honest.',
      p:'That’s a real answer, and it’s yours to give. If it ever sits differently, the facts on the last page will still be true, and this site will still be here.',
      v:false, sh:'If you’re curious', sp:'The Learn page covers what actually happens, plainly and without graphic images.',
      b:'<a class="qz-btn" href="learn.html">read the facts &rarr;</a><a class="qz-btn qz-ghost" href="brand-check.html">check a brand</a>'}
  }[finalAnswer];
  app.innerHTML = '<div class="qz-screen">'
   + '<div class="qz-res-card"><p class="qz-kick">thanks for answering</p><h1 class="qz-h">' + R.h + '</h1><p>' + R.p + '</p></div>'
   + (R.v ? VEG : '')
   + '<div class="qz-step"><p class="qz-kick">' + R.sh + '</p><p>' + R.sp + '</p><div class="qz-actions">' + R.b + '</div></div>'
   + '<div class="qz-actions"><button class="qz-btn qz-ghost" id="qzShare">share the quiz</button><button class="qz-btn qz-ghost" id="qzAgain">take it again</button></div>'
   + '<p class="qz-fine" id="qzShareMsg" role="status"></p>'
   + '<p class="qz-sign">your annoying vegan friend, Ash x</p>'
   + '<p class="qz-fine">Nothing you answered was saved or sent anywhere.</p>'
   + '</div>';
  document.getElementById('qzAgain').onclick = function(){ answers = Q.map(function(){ return null; }); start(); top0(); };
  document.getElementById('qzShare').onclick = function(){
    var t = 'Where do you draw the line? A two-minute quiz. Try it:';
    if (navigator.share) navigator.share({text:t, url:location.href}).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(t + ' ' + location.href).then(function(){ document.getElementById('qzShareMsg').textContent = 'Copied, ready to paste.'; });
  };
  top0();
}
start();
})();
</script>
