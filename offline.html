<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You're offline - a home kind</title>
<meta name="theme-color" content="#3A1F3D">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#3A1F3D; font-family:'Hanken Grotesk',sans-serif; padding:32px 24px; }
.card { max-width:360px; text-align:center; }
.card svg { margin-bottom:20px; }
h1 { color:#FBF4EF; font-family:'Gloock',serif; font-weight:500; font-size:26px; margin:0 0 14px; }
p { color:#D9C3CF; font-size:14.5px; line-height:1.8; margin:0 0 26px; }
button { background:#F6C6A8; color:#3A1F3D; font-family:'Hanken Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; border:none; padding:14px 28px; border-radius:30px; cursor:pointer; }
button:hover { background:#F2B896; }
</style>
</head>
<body>
<div class="card" id="main">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none">
<circle cx="20" cy="20" r="19" stroke="#9DBB98" stroke-width="1"/>
<path d="M20 30 C20 30 12 24 12 16 C16 16 20 19 20 24 C20 19 24 16 28 16 C28 24 20 30 20 30 Z" stroke="#9DBB98" stroke-width="1.2" fill="none"/>
<path d="M20 30 L20 12" stroke="#9DBB98" stroke-width="1"/>
</svg>
<h1>you're offline</h1>
<p>The scanner needs an internet connection to look up products and check brands - it can't work from memory. Reconnect and give it another try.</p>
<button onclick="location.reload()">try again</button>
</div>
</body>
</html>
