name: Daily site health check

# Runs on GitHub's own servers every day. No laptop, phone or approval needed.
# If any check fails, the run is marked failed and GitHub emails the repo owner.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the site
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, datetime, time

          BASE = "https://ahomekind.com"
          problems = []

          def get(path, retries=2):
              url = f"{BASE}{path}?hc={int(time.time())}"
              last = None
              for _ in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "ahomekind-health-check"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except Exception as e:
                      last = e
                      time.sleep(3)
              problems.append(f"{path} could not be loaded ({last})")
              return None, ""

          # 1 + 3: pages load with real content
          pages = ["/", "/brand-check.html", "/scan.html", "/ingredient-check.html", "/shop.html",
                   "/learn.html", "/perfume.html", "/about.html", "/take-action.html",
                   "/brands/dove/", "/brands/the-ordinary/"]
          for p in pages:
              status, body = get(p)
              if status is None:
                  continue
              if status != 200 or len(body) < 1500:
                  problems.append(f"{p} looks empty or broken (status {status}, {len(body)} characters)")

          # 2: http redirects to https
          try:
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *a, **k): return None
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  opener.open("http://ahomekind.com/", timeout=30)
                  problems.append("http://ahomekind.com does not redirect to https")
              except urllib.error.HTTPError as e:
                  loc = e.headers.get("Location", "")
                  if not (300 <= e.code < 400 and loc.startswith("https://")):
                      problems.append(f"http://ahomekind.com does not redirect to https (got {e.code} {loc})")
          except Exception as e:
              problems.append(f"http redirect check failed ({e})")

          # 4: data files are valid JSON with sensible counts
          def load(path):
              status, body = get(path)
              if status is None:
                  return None
              try:
                  return json.loads(body)
              except Exception as e:
                  problems.append(f"{path} is not valid JSON ({e})")
                  return None

          brands = load("/data/brands.json")
          if brands is not None:
              items = brands if isinstance(brands, list) else brands.get("brands", [])
              if len(items) < 1000:
                  problems.append(f"brands.json only has {len(items)} brands (expected 1000+)")
          for path in ["/data/perfume-brands.json", "/data/products.json"]:
              load(path)

          # 5: app files
          manifest = load("/manifest.json")
          if manifest is not None and manifest.get("id") != "/":
              problems.append(f"manifest.json id is {manifest.get('id')!r}, expected '/'")
          status, body = get("/sw.js")
          if status is not None and len(body) < 100:
              problems.append("sw.js looks empty")

          # 6: changelog freshness
          log = load("/data/changelog.json")
          if log is not None:
              entries = log if isinstance(log, list) else log.get("entries", log.get("changes", []))
              dates = [str(e.get("date", ""))[:10] for e in entries if isinstance(e, dict) and e.get("date")]
              if dates:
                  newest = max(dates)
                  age = (datetime.date.today() - datetime.date.fromisoformat(newest)).days
                  print(f"Newest changelog entry: {newest} ({age} days old)")
                  if age > 90:
                      print("Note: changelog is quite old - only matters if brands changed recently.")

          if problems:
              print("PROBLEMS FOUND:")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("Site is healthy.")
          PY
