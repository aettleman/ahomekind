<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Home Kind</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #3a3630;
    background: #fdfbf7;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  h1 img { width: 20px; height: 20px; }
  p.tagline {
    margin: 0 0 14px;
    font-size: 12px;
    color: #6b6656;
  }
  .status {
    font-size: 13px;
    line-height: 1.5;
    background: #ece5d5;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .status strong { display: block; margin-bottom: 2px; }
  .sites {
    font-size: 12px;
    color: #6b6656;
    margin: 0 0 14px;
    line-height: 1.5;
  }
  button {
    width: 100%;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    background: #4d6b4f;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  a { color: #4d6b4f; }
</style>
</head>
<body>
  <h1><img src="icons/icon-32.png" alt=""> A Home Kind</h1>
  <p class="tagline">Cruelty-free check, while you shop.</p>
  <div class="status" id="status">Checking brand list&hellip;</div>
  <p class="sites">Works on product pages on Amazon UK, Boots, Superdrug and Ocado. A small badge appears near the title when the brand is one we've checked.</p>
  <button id="refresh">Refresh brand list now</button>
  <script src="popup.js"></script>
</body>
</html>
